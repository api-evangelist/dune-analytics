      operationId: postV1QueryByQueryIdUnprivate
      x-operation-id-source: derived
  /v1/query/{query_id}/execute:
    post:
      parameters:
      - description: API Key for the service
        in: header
        name: X-Dune-Api-Key
        required: true
        schema:
          type: string
      - description: Alternative to using the X-Dune-Api-Key header
        in: query
        name: api_key
        schema:
          type: string
      - description: Unique identifier of the query
        in: path
        name: query_id
        required: true
        schema:
          type: integer
      - description: The performance engine tier the execution will be run on. Can be `small`, `medium`, or `large`. Omit to use the default tier for the query engine. Credits are consumed based on actual compute resources used.
        in: query
        name: performance
        schema:
          enum:
          - small
          - medium
          - large
          type: string
      - description: SQL Query parameters in json key-value pairs. Each parameter is to be provided in key-value pairs. This enables you to execute a parameterized query with the provided values for your parameter keys. Partial submission of parameters is allowed. For example, if the query expects three parameters and you only pass in two, the third one will automatically use its default value as defined in the Query Parameter Editor page.
        in: query
        name: query_parameters
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ExecuteQueryResponse'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.Error400'
          description: Bad Request
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.Error401'
          description: Unauthorized
        '402':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.Error402'
          description: Payment Required
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.Error403'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.Error404'
          description: Not Found
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.Error500'
          description: Internal Server Error
      summary: Execute, or run a query for the specified query ID
      x-required-scope: Read
      tags:
      - Query
      operationId: postV1QueryByQueryIdExecute
      x-operation-id-source: derived
  /v1/query/{query_id}/pipeline:
    get:
      description: Builds a query pipeline from the specified query and returns the pipeline definition containing all the nested materialized views that the query depends on. A pipeline allows you to chain multiple queries together and execute them as a single unit.
      parameters:
      - description: API Key for the service
        in: header
        name: X-Dune-Api-Key
        required: true
        schema:
          type: string
      - description: Alternative to using the X-Dune-Api-Key header
        in: query
        name: api_key
        schema:
          type: string
      - description: Unique identifier of the query
        in: path
        name: query_id
        required: true
        schema:
          type: integer
      - description: The performance engine tier. Can be `small`, `medium`, or `large`.
        in: query
        name: performance
        schema:
          type: string
      - description: SQL Query parameters in json key-value pairs
        in: query
        name: query_parameters
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.GetQueryPipelineResponse'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.Error400'
          description: Bad Request
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.Error401'
          description: Unauthorized
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.Error404'
          description: Not Found
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.Error500'
          description: Internal Server Error
      summary: Get query pipeline
      x-required-scope: Read
      tags:
      - Query
      operationId: getV1QueryByQueryIdPipeline
      x-operation-id-source: derived
  /v1/query/{query_id}/pipeline/execute:
    post:
      description: Builds a query pipeline from the specified query and executes it. A pipeline allows you to chain multiple queries together and execute them as a single unit.
      parameters:
      - description: API Key for the service
        in: header
        name: X-Dune-Api-Key
        required: true
        schema:
          type: string
      - description: Alternative to using the X-Dune-Api-Key header
        in: query
        name: api_key
        schema:
          type: string
      - description: Unique identifier of the query
        in: path
        name: query_id
        required: true
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/models.ExecuteQueryPipelineRequest'
        description: Query pipeline execution request
        required: true
        x-originalParamName: body
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ExecuteQueryPipelineResponse'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.Error400'
          description: Bad Request
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.Error401'
          description: Unauthorized
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.Error404'
          description: Not Found
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.Error500'
          description: Internal Server Error
      summary: Execute a query pipeline
      x-required-scope: Read
      tags:
      - Query
      operationId: postV1QueryByQueryIdPipelineExecute
      x-operation-id-source: derived
  /v1/query/{query_id}/results:
    get:
      description: Given a query ID, returns the latest executed result of a query on Dune in JSON format
      parameters:
      - description: API Key for the service
        in: header
        name: X-Dune-Api-Key
        required: true
        schema:
          type: string
      - description: Alternative to using the X-Dune-Api-Key header
        in: query
        name: api_key
        schema:
          type: string
      - description: Query ID
        in: path
        name: query_id
        required: true
        schema:
          type: string
      - description: 'This enables returning a query result that was too large and only a partial result is

          available. By default, allow_partial_results is set to false and a failed state is returned.'
        in: query
        name: allow_partial_results
        schema:
          type: boolean
      - description: 'Specifies a comma-separated list of column names to return. If omitted, all columns are included.

          Tip: use this to limit the result to specific columns, reducing datapoints cost of the call.'
        in: query
        name: columns
        schema:
          type: string
      - description: 'Expression to filter out rows from the results to return. This expression is similar to

          a SQL WHERE clause. More details about it in the Filtering section of the doc.

          This parameter is incompatible with sample_count.'
        in: query
        name: filters
        schema:
          type: string
      - description: To bypass the default max credits per request limit, set ignore_max_credits_per_request=true
        in: query
        name: ignore_max_credits_per_request
        schema:
          type: boolean
      - description: 'Limit number of rows to return. This together with ''offset'' allows easy pagination through

          results in an incremental and efficient way. This parameter is incompatible

          with sampling (sample_count).'
        in: query
        name: limit
        schema:
          type: integer
      - description: 'Offset row number to start (inclusive, first row means offset=0) returning results

          from. This together with ''limit'' allows easy pagination through results in an

          incremental and efficient way. This parameter is incompatible with sampling (sample_count).'
        in: query
        name: offset
        schema:
          type: integer
      - in: query
        name: queryID
        required: true
        schema:
          type: integer
      - description: 'Number of rows to return from the result by sampling the data. This is useful when you

          want to get a uniform sample instead of the entire result. If the result has less

          than the sample count, the entire result is returned. Note that this will return a

          randomized sample, so not every call will return the same result. This parameter is

          incompatible with `offset`, `limit`, and `filters` parameters.'
        in: query
        name: sample_count
        schema:
          type: integer
      - description: 'Expression to define the order in which the results should be returned. This expression

          is similar to a SQL ORDER BY clause. More details about it in the Sorting section of the doc.'
        in: query
        name: sort_by
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ReadExecutionResultResponse'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.Error400'
          description: Bad Request
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.Error404'
          description: Not Found
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.Error500'
          description: Internal Server Error
      summary: Get Latest Query Result
      x-required-scope: Read
      tags:
      - Query
      operationId: getV1QueryByQueryIdResults
      x-operation-id-source: derived
  /v1/query/{query_id}/results/csv:
    get:
      parameters:
      - description: API Key for the service
        in: header
        name: X-Dune-Api-Key
        required: true
        schema:
          type: string
      - description: Alternative to using the X-Dune-Api-Key header
