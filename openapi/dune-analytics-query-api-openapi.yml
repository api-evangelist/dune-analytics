        name: allow_partial_results
        schema:
          type: boolean
      - description: 'Specifies a comma-separated list of column names to return. If omitted, all columns are included.

          Tip: use this to limit the result to specific columns, reducing datapoints cost of the call.'
        in: query
        name: columns
        schema:
          type: string
      - description: 'Expression to filter out rows from the results to return. This expression is similar to

          a SQL WHERE clause. More details about it in the Filtering section of the doc.

          This parameter is incompatible with sample_count.'
        in: query
        name: filters
        schema:
          type: string
      - description: To bypass the default max credits per request limit, set ignore_max_credits_per_request=true
        in: query
        name: ignore_max_credits_per_request
        schema:
          type: boolean
      - description: 'Limit number of rows to return. This together with ''offset'' allows easy pagination through

          results in an incremental and efficient way. This parameter is incompatible

          with sampling (sample_count).'
        in: query
        name: limit
        schema:
          type: integer
      - description: 'Offset row number to start (inclusive, first row means offset=0) returning results

          from. This together with ''limit'' allows easy pagination through results in an

          incremental and efficient way. This parameter is incompatible with sampling (sample_count).'
        in: query
        name: offset
        schema:
          type: integer
      - in: query
        name: queryID
        required: true
        schema:
          type: integer
      - description: 'Number of rows to return from the result by sampling the data. This is useful when you

          want to get a uniform sample instead of the entire result. If the result has less

          than the sample count, the entire result is returned. Note that this will return a

          randomized sample, so not every call will return the same result. This parameter is

          incompatible with `offset`, `limit`, and `filters` parameters.'
        in: query
        name: sample_count
        schema:
          type: integer
      - description: 'Expression to define the order in which the results should be returned. This expression

          is similar to a SQL ORDER BY clause. More details about it in the Sorting section of the doc.'
        in: query
        name: sort_by
        schema:
          type: string
      responses:
        '200':
          content:
            text/plain:
              schema:
                type: string
          description: OK
        '400':
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/models.Error400'
          description: Bad Request
        '404':
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/models.Error404'
          description: Not Found
        '500':
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/models.Error500'
          description: Internal Server Error
      summary: Given a query ID, returns the latest executed result of a query on Dune as CSV
      x-required-scope: Read
      tags:
      - Query
      operationId: getV1QueryByQueryIdResultsCsv
      x-operation-id-source: derived
components:
  schemas:
    models.Error403:
      properties:
        error:
          example: Not allowed to execute query. Query is archived, unsaved or not enough permissions
          type: string
      type: object
    models.SyntaxErrorMetadata:
      properties:
        column:
          description: The column number at which the syntax error occurred.
          example: 73
          type: integer
        line:
          description: The line number at which the syntax error occurred in the query.
          example: 10
          type: integer
      type: object
    models.UpdateQueryResponse:
      properties:
        query_id:
          description: The unique ID of the query that was updated
          type: integer
      type: object
    models.ExecuteQueryResponse:
      properties:
        execution_id:
          example: 01HKZJ2683PHF9Q9PHHQ8FW4Q1
          type: string
        state:
          example: QUERY_STATE_PENDING
          type: string
