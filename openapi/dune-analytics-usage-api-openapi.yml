openapi: 3.2.0
info:
  contact: {}
  description: Dune API
  title: Dune Usage API
  version: '1.0'
servers:
- url: https://api.dune.com/api
tags:
- name: Usage
paths:
  /v1/usage:
    post:
      description: 'Get usage data for the authenticated customer including private queries, dashboards,

        bytes used/allowed, and billing periods'
      parameters:
      - description: API Key for the service
        in: header
        name: X-Dune-Api-Key
        required: true
        schema:
          type: string
      - description: API Key, alternative to using the HTTP header X-Dune-Api-Key
        in: query
        name: api_key
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/models.GetUsageRequest'
        description: Request payload with optional start_date and end_date
        x-originalParamName: payload
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.GetUsageResponse'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.Error400'
          description: Bad Request
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.Error401'
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.Error403'
          description: Forbidden
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.Error500'
          description: Internal Server Error
      summary: Get Usage Data
      x-required-scope: Read
      tags:
      - Usage
      operationId: postV1Usage
      x-operation-id-source: derived
components:
  schemas:
    models.GetUsageRequest:
      properties:
        end_date:
          description: Optional field in YYYY-MM-DD format
          type: string
        start_date:
          description: Optional field in YYYY-MM-DD format
          type: string
      type: object
    models.Error400:
      properties:
        error:
          example: Bad Request
          type: string
      type: object
    models.Error403:
      properties:
        error:
          example: Not allowed to execute query. Query is archived, unsaved or not enough permissions
          type: string
      type: object
    models.BillingPeriod:
      properties:
        credits_included:
          description: Float value
          type: number
        credits_used:
          description: Float value
          type: number
        end_date:
          description: YYYY-MM-DD format
          type: string
        start_date:
          description: YYYY-MM-DD format
          type: string
      type: object
    models.Error401:
      properties:
        error:
          example: Invalid API Key
          type: string
      type: object
    models.GetUsageResponse:
      properties:
        billing_periods:
          items:
            $ref: '#/components/schemas/models.BillingPeriod'
          type: array
        bytes_allowed:
          type: integer
        bytes_used:
          type: integer
        private_dashboards:
          type: integer
        private_queries:
          type: integer
      type: object
    models.Error500:
      properties:
        error:
          example: Internal error
          type: string
      type: object
x-service-info:
  categories:
  - data
  - compute
  docs:
    apiReference: https://docs.dune.com/api-reference/overview/introduction
    homepage: https://docs.dune.com
x-provenance:
  method: harvested
  publisher: Dune Analytics
